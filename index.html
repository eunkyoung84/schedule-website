                                ${d.mapQuery ? `
                                <div>
                                    <a class="inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold rounded-xl px-4 py-2.5 transition-colors shadow-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.mapQuery)}">
                                        <i class="ph-fill ph-map-pin"></i> 구글 지도로 보기
                                    </a>
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderDays() {
            const nav = document.getElementById('daynav');
            const wrap = document.getElementById('days');
            
            // 네비게이션 탭 렌더링
            nav.innerHTML = DAYS.map((d, i) => `
                <button class="daytab shrink-0 flex flex-col items-center justify-center px-4 py-2 rounded-full border border-transparent transition-all outline-none ${i === 0 ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 hover:bg-slate-100 border-slate-200'}" data-day="${d.id}" aria-selected="${i === 0}">
                    <span class="text-[10px] sm:text-xs font-mono font-bold opacity-70 mb-0.5">${d.date}</span>
                    <span class="text-sm font-semibold">${d.tab}</span>
                </button>
            `).join('');

            // 메인 콘텐츠 렌더링
            wrap.innerHTML = DAYS.map((d, i) => `
                <section class="day hidden opacity-0 transition-opacity duration-300" data-id="${d.id}" data-active="${i === 0}">
                    <div class="mb-6 px-2 sm:px-4">
                        <h2 class="text-2xl font-bold text-slate-900 mb-1">${d.title}</h2>
                        <p class="text-sm text-slate-500 font-medium">${d.sub}</p>
                    </div>
                    <div class="flex flex-col">
                        ${d.items.map((it, idx) => stopHtml(it, d.id + '-' + idx)).join('')}
                    </div>
                </section>
            `).join('');

            // 초기 활성화 탭 표시 (스타일 적용을 위해)
            const firstDay = wrap.querySelector('.day');
            if(firstDay) {
                firstDay.classList.remove('hidden');
                setTimeout(() => firstDay.classList.remove('opacity-0'), 50);
            }

            // 탭 클릭 이벤트 바인딩
            nav.querySelectorAll('.daytab').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-day');
                    
                    // 탭 스타일 변경
                    nav.querySelectorAll('.daytab').forEach(b => {
                        const isSelected = b === btn;
                        b.setAttribute('aria-selected', isSelected);
                        b.className = `daytab shrink-0 flex flex-col items-center justify-center px-4 py-2 rounded-full border border-transparent transition-all outline-none ${isSelected ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 hover:bg-slate-100 border-slate-200'}`;
                    });
                    
                    // 콘텐츠 페이드인/아웃 로직
                    wrap.querySelectorAll('.day').forEach(sec => {
                        const isTarget = sec.getAttribute('data-id') === id;
                        sec.setAttribute('data-active', isTarget);
                        
                        if(isTarget) {
                            sec.classList.remove('hidden');
                            setTimeout(() => sec.classList.remove('opacity-0'), 10);
                        } else {
                            sec.classList.add('hidden');
                            sec.classList.add('opacity-0');
                        }
                    });
                    
                    // 스크롤 상단으로 이동
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            // 아코디언 토글 이벤트
            wrap.querySelectorAll('[data-toggle]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const stop = btn.closest('.stop');
                    const open = stop.getAttribute('data-open') === 'true';
                    stop.setAttribute('data-open', !open);
                });
            });
        }

        // 초기화 실행
        renderDays();
    </script>
</body>
</html>
